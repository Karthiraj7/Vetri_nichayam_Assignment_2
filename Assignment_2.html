<script>
const Rock = document.getElementById("Rock");
const Paper = document.getElementById("Paper");
const Scissor = document.getElementById("Scissor");
const Results = document.getElementById("Results");

function computerChoices() {
    let Choices = ['Rock', 'Paper', 'Scissor'];
    return Choices[Math.floor(Math.random() * 3)];
}

function playGame(playerChoice) {
    let computer = computerChoices();

    if (playerChoice === computer) {
        Results.innerHTML = `Draw! Both chose ${playerChoice}`;
    } 
    else if (
        (playerChoice === "Rock" && computer === "Scissor") ||
        (playerChoice === "Paper" && computer === "Rock") ||
        (playerChoice === "Scissor" && computer === "Paper")
    ) {
        Results.innerHTML = `You Win! ${playerChoice} beats ${computer}`;
        
    }
    else {
        Results.innerHTML = `You Lose! ${computer} beats ${playerChoice}`;
    }
}

// Rock.onclick = () => playGame("Rock");

// Scissor.onclick = () => playGame("Scissor");
Rock.addEventListener ('click',() => playGame("Rock"))

Scissor.addEventListener ('click',() => playGame("Scissor"))


// method two


function computerChoices() {
    let num = Math.floor(Math.random() * 3); 

    if (num === 0) {
        return "Rock";
    } else if (num === 1) {
        return "Paper";
    } else {
        return "Scissor";
    }
}
function playGame(playerChoice) {

    let computer = computerChoices();

    if (playerChoice === computer) {
      alert(  Results.innerHTML = `Draw! Both chose ${playerChoice}`);
    } 
    else if (playerChoice === "Rock") {
        if (computer === "Scissor") {
            Results.innerHTML = "Rock beats Scissor — You WIN!";
        } else {
         
            Results.innerHTML = "Paper beats Rock — You LOSE!";
        }
    }
    else if (playerChoice === "Paper") {
        if (computer === "Rock") {
            Results.innerHTML = "Paper beats Rock — You WIN!";
        } else {
            Results.innerHTML = "Scissor beats Paper — You LOSE!";
        }
    }
    else if (playerChoice === "Scissor") {
        if (computer === "Paper") {
            Results.innerHTML = "Scissor beats Paper — You WIN!";
        } else {
            Results.innerHTML = "Rock beats Scissor — You LOSE!";
        }
    }
}
